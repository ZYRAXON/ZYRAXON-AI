services:
  - type: web
    name: zyraxon-mobile-agent
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "3001"
      - key: MOBILE_AI_PROVIDER
        value: zyraxon
      - key: MOBILE_AI_MODEL
        value: mimo-v2.5-free
      - key: ZYRAXON_API_KEY
        sync: false
      - key: ZYRAXON_API_URL
        value: https://opencode.ai/zen/v1
      - key: ZYRAXON_API_KEY
        value: ""
