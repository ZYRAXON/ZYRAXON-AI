<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="0.45" stop-color="#6D28D9"/>
      <stop offset="0.8" stop-color="#A21CAF"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#F9A8D4"/>
    </linearGradient>
    <linearGradient id="cardIcon1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="cardIcon2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="cardIcon3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9D5FF"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.12" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="0.92" r="0.5">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="150%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1E1B4B" flood-opacity="0.45"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-40%" width="170%" height="190%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#160B33" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Decorative rings -->
  <circle cx="60" cy="560" r="150" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" fill="none"/>
  <circle cx="60" cy="560" r="90" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" fill="none"/>
  <circle cx="1180" cy="40" r="110" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" fill="none"/>

  <!-- Floating cart glyph (top right) -->
  <g opacity="0.9" transform="translate(1085, 52)">
    <rect x="0" y="4" width="34" height="30" rx="7" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
    <path d="M7 10 h24 l-3 14 h-18 z" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 10 a5 4 0 0 1 10 0" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="15" cy="28" r="2.4" fill="#F9A8D4"/>
    <circle cx="26" cy="28" r="2.4" fill="#F9A8D4"/>
  </g>

  <!-- ==================== LEFT: HERO TEXT ==================== -->

  <!-- Badge pill -->
  <g transform="translate(70, 86)">
    <rect x="0" y="0" width="272" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
    <path d="M19 8 l2.1 5.2 5.4 0.4 -4.2 3.6 1.3 5.5 -4.6 -3 -4.6 3 1.3 -5.5 -4.2 -3.6 5.4 -0.4 z" fill="#F9A8D4"/>
    <path d="M253 8 l2.1 5.2 5.4 0.4 -4.2 3.6 1.3 5.5 -4.6 -3 -4.6 3 1.3 -5.5 -4.2 -3.6 5.4 -0.4 z" fill="#F9A8D4"/>
    <text x="140" y="30" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="19" font-weight="700" letter-spacing="3.5" fill="#FFFFFF">FEATURED TEMPLATE</text>
  </g>

  <!-- Title -->
  <text x="70" y="235" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="108" font-weight="800" letter-spacing="-2" fill="url(#titleGrad)">NovaMart</text>

  <!-- Subtitle -->
  <text x="72" y="292" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="42" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" fill-opacity="0.95">Premium Online Store</text>

  <!-- Tagline -->
  <text x="72" y="342" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" fill-opacity="0.72">A complete modern storefront — launch your business in minutes.</text>

  <!-- Stats -->
  <g font-family="'Inter','Segoe UI',system-ui,sans-serif">
    <text x="72" y="412" font-size="40" font-weight="800" fill="#FFFFFF">14</text>
    <text x="72" y="440" font-size="17" font-weight="500" fill="#FFFFFF" fill-opacity="0.65" letter-spacing="1.2">PRODUCTS</text>
    <text x="175" y="412" font-size="40" font-weight="800" fill="#FFFFFF">4</text>
    <text x="175" y="440" font-size="17" font-weight="500" fill="#FFFFFF" fill-opacity="0.65" letter-spacing="1.2">CATEGORIES</text>
    <text x="295" y="412" font-size="40" font-weight="800" fill="#FFFFFF">100%</text>
    <text x="295" y="440" font-size="17" font-weight="500" fill="#FFFFFF" fill-opacity="0.65" letter-spacing="1.2">RESPONSIVE</text>
    <circle cx="163" cy="400" r="3" fill="#F9A8D4"/>
    <circle cx="285" cy="400" r="3" fill="#F9A8D4"/>
  </g>

  <!-- CTA pill -->
  <g filter="url(#softShadow)">
    <rect x="72" y="478" width="250" height="56" rx="28" fill="#FFFFFF"/>
    <text x="112" y="514" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="20" font-weight="700" fill="#5B21B6">View Template</text>
    <path d="M296 500 l10 6 -10 6" stroke="#5B21B6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Footer -->
  <text x="72" y="596" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" fill-opacity="0.5" letter-spacing="1.5">ZYRAXON ECOSYSTEM</text>
  <circle cx="248" cy="591" r="2.5" fill="#FFFFFF" fill-opacity="0.5"/>
  <text x="260" y="596" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" fill-opacity="0.5">by @sayidilxs-web</text>

  <!-- ==================== RIGHT: GLASS PRODUCT CARDS ==================== -->

  <!-- Card A: Sneakers -->
  <g transform="translate(688, 96) rotate(-4 172 78)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="344" height="156" rx="20" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.5"/>
    <rect x="0" y="0" width="344" height="156" rx="20" fill="url(#shine)"/>
    <rect x="18" y="18" width="88" height="88" rx="18" fill="url(#cardIcon1)"/>
    <!-- Sneaker icon -->
    <g transform="translate(38, 48)" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M2 18 h34 l6 8 h-44 z"/>
      <path d="M4 18 v-6 a6 6 0 0 1 6 -6 h14 l6 6"/>
      <path d="M24 14 h6 l4 4"/>
    </g>
    <text x="126" y="52" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Urban Sneakers</text>
    <text x="126" y="80" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.7">Footwear · Best seller</text>
    <text x="126" y="118" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="26" font-weight="800" fill="#F9A8D4">$89</text>
    <rect x="280" y="16" width="52" height="26" rx="13" fill="#F472B6"/>
    <text x="306" y="34" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="1" fill="#FFFFFF">NEW</text>
    <circle cx="312" cy="132" r="14" fill="#FFFFFF" fill-opacity="0.22"/>
    <path d="M312 126 v12 M306 132 h12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Card B: Smartwatch -->
  <g transform="translate(766, 288) rotate(3 172 78)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="344" height="156" rx="20" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.5"/>
    <rect x="0" y="0" width="344" height="156" rx="20" fill="url(#shine)"/>
    <rect x="18" y="18" width="88" height="88" rx="18" fill="url(#cardIcon2)"/>
    <!-- Smartwatch icon -->
    <g transform="translate(48, 46)" fill="none">
      <rect x="4" y="0" width="16" height="7" rx="3" stroke="#FFFFFF" stroke-width="4"/>
      <rect x="0" y="6" width="24" height="36" rx="8" stroke="#FFFFFF" stroke-width="4"/>
      <rect x="4" y="10" width="16" height="28" rx="6" fill="#FFFFFF" fill-opacity="0.28"/>
      <path d="M12 16 v4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="12" cy="28" r="4" fill="#FFFFFF" fill-opacity="0.85"/>
    </g>
    <text x="126" y="52" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Smart Watch Pro</text>
    <text x="126" y="80" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.7">Electronics · New arrival</text>
    <text x="126" y="118" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="26" font-weight="800" fill="#F9A8D4">$199</text>
    <rect x="272" y="16" width="60" height="26" rx="13" fill="#FB923C"/>
    <text x="302" y="34" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="1" fill="#FFFFFF">HOT</text>
    <circle cx="312" cy="132" r="14" fill="#FFFFFF" fill-opacity="0.22"/>
    <path d="M312 126 v12 M306 132 h12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Card C: Headphones -->
  <g transform="translate(672, 468) rotate(-2.5 172 78)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="344" height="156" rx="20" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.5"/>
    <rect x="0" y="0" width="344" height="156" rx="20" fill="url(#shine)"/>
    <rect x="18" y="18" width="88" height="88" rx="18" fill="url(#cardIcon3)"/>
    <!-- Headphones icon -->
    <g transform="translate(44, 46)" fill="none">
      <path d="M4 28 v-8 a12 12 0 0 1 24 0 v8" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
      <rect x="0" y="26" width="9" height="14" rx="4.5" fill="#FFFFFF" fill-opacity="0.9"/>
      <rect x="23" y="26" width="9" height="14" rx="4.5" fill="#FFFFFF" fill-opacity="0.9"/>
    </g>
    <text x="126" y="52" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Wireless Buds</text>
    <text x="126" y="80" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.7">Audio · On sale</text>
    <text x="126" y="118" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="26" font-weight="800" fill="#F9A8D4">$59</text>
    <circle cx="312" cy="132" r="14" fill="#FFFFFF" fill-opacity="0.22"/>
    <path d="M312 126 v12 M306 132 h12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Small floating badges -->
  <g transform="translate(1010, 240)" filter="url(#softShadow)">
    <rect x="0" y="0" width="132" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="26" cy="22" r="9" fill="#F9A8D4"/>
    <path d="M21 22 h10 M26 17 v10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="46" y="27" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Cart ready</text>
  </g>

  <g transform="translate(1012, 560)" filter="url(#softShadow)">
    <rect x="0" y="0" width="148" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="9" fill="#34D399"/>
    <path d="M18.5 22 l4 4 l7 -8" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="27" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Fully responsive</text>
  </g>
</svg>
